[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "p3-python-agent"
version = "0.1.0"
description = "Bounded LangGraph client for the existing Java MCP security gateway"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
  "mcp==1.30.0", "langgraph==1.2.16", "langchain==1.4.7",
  "langchain-openai==1.7.2", "pydantic==2.14.1", "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.2"]

[tool.setuptools.packages.find]
include = ["p3_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--show-capture=no --tb=short"

[tool.ruff]
line-length = 100
